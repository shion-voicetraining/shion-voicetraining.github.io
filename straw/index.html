<title>ストロー発声トレーナー β｜SHIONボイストレーニング教室</title>
<meta name="theme-color" content="#f2ede8" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<!-- 生徒向け限定公開ツール。検索非登録（unlisted） -->

<style>
  :root{
    --bg:#f2ede8; --surface:#f8f3ee; --card:#ffffff; --ink:#1a1714; --ink2:#06060e;
    --muted:#65594f; --line:#e5ddd3;
    --teal:#0e7490; --teal-l:#62c0d8; --wine:#b83060; --wine-d:#7d1a38; --pink:#e05c7a;
    --amber:#b06800; --amber-l:#f5a623; --green:#1e7a42;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body,#root{height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;line-height:1.6;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;gap:12px;z-index:50;}
  .spinner{width:28px;height:28px;border:2.5px solid rgba(176,104,0,0.15);
    border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));}
  .safety{position:sticky;top:0;z-index:20;background:#fbeef0;color:var(--wine-d);
    border-bottom:1px solid #f2d6dc;font-size:12.5px;padding:8px 16px;text-align:center;font-weight:600;}
  .head{padding:20px 18px 10px;}
  .head h1{font-size:19px;letter-spacing:.02em;}
  .head p{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .streak{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink);}
  .streak b{color:var(--amber);font-size:14px;}

  .screen{padding:6px 16px 24px;flex:1;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.02);}
  .card h3{font-size:15px;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
  .card p{font-size:13.5px;color:#332c26;}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    color:#fff;letter-spacing:.03em;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;
    border:1px solid var(--line);color:var(--muted);background:var(--surface);}
  .lead{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--amber);margin:18px 2px 8px;}
  .lead.sub{color:var(--muted);}
  .sectionNote{font-size:12px;color:var(--muted);margin:2px 2px 12px;}

  table.bp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  table.bp th,table.bp td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
  table.bp th{background:var(--surface);color:var(--muted);font-weight:700;}

  .step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .step .b{flex:1;}
  .step .b b{font-size:14px;}
  .step .b span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}

  .check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:7px 0;}
  .check .ic{color:var(--green);font-weight:900;flex:0 0 auto;}

  details.tb{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--card);overflow:hidden;}
  details.tb summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:700;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  details.tb summary::-webkit-details-marker{display:none;}
  details.tb summary .arw{color:var(--muted);font-size:12px;transition:transform .2s;}
  details.tb[open] summary .arw{transform:rotate(90deg);}
  details.tb .body{padding:0 14px 13px;font-size:13px;color:#332c26;}
  details.tb .body .why{color:var(--muted);}
  details.tb .body .fix{margin-top:5px;}
  details.tb .body .fix b{color:var(--green);}

  .exhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .exhead .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;}
  .ex .goal{font-size:12.5px;color:var(--muted);margin:2px 0 8px;}
  .ex .cue{font-size:12.5px;background:var(--surface);border-radius:10px;padding:9px 11px;margin-bottom:10px;}
  .ex .cue b{color:var(--green);}
  .ex .spec{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .btnrow{display:flex;gap:8px;}
  button{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:11px;
    padding:11px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .btn-primary{background:var(--wine);color:#fff;flex:1;}
  .btn-primary:active{background:var(--wine-d);}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-tone{background:var(--teal);color:#fff;}

  .round{width:100%;text-align:left;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;display:flex;gap:10px;align-items:flex-start;color:var(--ink);}

  @keyframes bubbleUp{0%{transform:translateY(0);opacity:0;}
    20%{opacity:.95;}100%{transform:translateY(-44px);opacity:0;}}
  .bub{animation:bubbleUp 2s ease-in infinite;}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(248,243,238,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);}
  nav .inner{max-width:520px;margin:0 auto;display:flex;}
  nav button{flex:1;background:none;border:none;border-radius:0;padding:10px 4px;color:var(--muted);
    font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ic{font-size:19px;line-height:1;}
  nav button.on{color:var(--wine);}
  .foot{font-size:11px;color:var(--muted);text-align:center;padding:18px 20px 8px;line-height:1.7;}
  button{touch-action:manipulation;min-height:44px;}
  button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* メニュー */
  .ex{scroll-margin-top:52px;}
  .quick{border:2px solid var(--wine);}
  .quick .k{font-size:12px;font-weight:800;color:var(--wine);}
  .quick .t{font-size:17px;font-weight:800;line-height:1.4;}
  .quick .m{font-size:13px;color:var(--muted);margin:2px 0 12px;}
  .btn-big{min-height:60px;font-size:18px;width:100%;border-radius:14px;}
  .ex .btnrow{flex-wrap:wrap;}

  /* 設定 */
  details.settings summary .sum{display:block;font-size:12px;color:var(--muted);font-weight:400;}
  .opt{padding:11px 0;border-top:1px solid var(--line);}
  .opt>.name{display:block;font-size:13.5px;font-weight:700;color:var(--ink);}
  .opt .note{font-size:12px;color:var(--muted);margin-top:3px;}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;}
  .stepper .name{font-size:13.5px;font-weight:700;}
  .stepper .ctl{display:flex;align-items:center;gap:4px;}
  .stepper button{width:44px;padding:0;font-size:22px;}
  .stepper button:disabled{opacity:.35;cursor:default;}
  .stepper output{min-width:78px;text-align:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
  input[type=range]{display:block;width:100%;height:44px;margin:0;accent-color:var(--wine);}
  .vol{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink);}
  .vol>span{flex:0 0 64px;}
  .vol>b{flex:0 0 30px;text-align:right;font-variant-numeric:tabular-nums;}
  .choices{display:flex;gap:6px;margin-top:7px;}
  .choices button{flex:1;padding:6px 3px;font-size:12.5px;line-height:1.3;background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .choices button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine);}
  .switch{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px;font-weight:700;color:var(--ink);}
  .switch input{width:24px;height:24px;accent-color:var(--wine);}
  .notice{font-size:13px;color:var(--wine-d);background:#fbe9ee;border-radius:10px;padding:9px 11px;margin-bottom:10px;}

  /* 練習中：全画面。停止は常に画面下 */
  .player{--pc:var(--muted);position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;display:flex;flex-direction:column;
    background:var(--bg);overflow:hidden;outline:none;}
  .player.prep{--pc:#935600;background:#fbf0dc;}
  .player.work{--pc:var(--wine);background:#f8e3ea;}
  .player.rest{--pc:var(--teal);background:#e0f0f4;}
  .player.done{--pc:var(--green);background:#e4f2e8;}
  .player.paused{--pc:#4d4640;background:#e6e1dc;}
  .player .safety{flex:none;padding-top:calc(7px + env(safe-area-inset-top));}
  .ptop{flex:none;width:100%;max-width:520px;margin:0 auto;padding:8px 18px 0;text-align:center;}
  .ptop .t{font-size:14px;font-weight:800;line-height:1.35;}
  .ptop .r{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .pmain{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;padding:4px 18px;overflow-y:auto;
    display:flex;flex-direction:column;align-items:center;}
  .pmain>:first-child{margin-top:auto;}
  .pmain>:last-child{margin-bottom:auto;}
  .phead{text-align:center;flex:none;}
  .phase{display:inline-block;font-size:24px;font-weight:900;line-height:1.3;color:#fff;background:var(--pc);padding:3px 22px;border-radius:999px;}
  .instr{font-size:15px;font-weight:700;color:var(--pc);margin-top:5px;}
  .dial{position:relative;flex:none;width:min(62vw,33vh,260px);height:min(62vw,33vh,260px);margin:8px 0;}
  .dial svg{width:100%;height:100%;transform:rotate(-90deg);}
  .dial .track{fill:rgba(255,255,255,.65);stroke:rgba(0,0,0,.08);stroke-width:12;}
  .dial .bar{fill:none;stroke:var(--pc);stroke-width:12;}
  .dial .in{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
  .dial .num{font-size:min(19vw,10.5vh,82px);font-weight:900;color:var(--pc);font-variant-numeric:tabular-nums;line-height:1;}
  .dial .unit{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px;}
  .pside{flex:none;width:100%;max-width:340px;text-align:center;}
  .beats{display:flex;justify-content:center;align-items:center;gap:13px;height:26px;}
  .beats i{width:15px;height:15px;border-radius:50%;border:2px solid var(--pc);}
  .beats i:first-child{width:22px;height:22px;}
  .beats i.on{background:var(--pc);}
  .readout{display:flex;justify-content:center;gap:28px;margin:4px 0 2px;}
  .readout span{display:block;font-size:11px;color:var(--muted);}
  .readout b{display:block;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .path{display:block;width:100%;height:min(9vh,62px);}
  .pathlabel{font-size:11px;color:var(--muted);}
  .pbottom{flex:none;width:100%;max-width:520px;margin:0 auto;padding:8px 18px calc(12px + env(safe-area-inset-bottom));}
  .pbottom .btnrow button{flex:1;min-height:64px;font-size:18px;border-radius:16px;}
  .btn-go{background:var(--wine);color:#fff;}
  .btn-stop{background:var(--ink);color:#fff;}
  .btn-pause{background:#fff;color:var(--ink);border:2px solid var(--pc);}
  .voltoggle{display:block;margin:0 auto;background:none;color:var(--ink);font-size:13px;padding:4px 14px;text-decoration:underline;}
  .volpanel{background:#fff;border-radius:12px;padding:0 12px;}
  @media (max-height:610px) and (orientation:portrait){
    .phase{font-size:19px;} .instr{font-size:13px;margin-top:2px;} .readout b{font-size:17px;}
    .player .safety{font-size:11px;padding-top:4px;padding-bottom:4px;}
    .pbottom .btnrow button{min-height:56px;}
    .dial{width:28vh;height:28vh;margin:4px 0;} .pathlabel{display:none;} .path{height:36px;}
  }
  @media (orientation:landscape) and (max-height:500px){
    .player .safety{font-size:11px;padding:3px;}
    .ptop,.pmain,.pbottom{max-width:760px;}
    .ptop{padding-top:2px;display:flex;justify-content:center;align-items:baseline;gap:14px;}
    .pmain{display:grid;grid-template-columns:auto 1fr;align-content:center;align-items:center;column-gap:22px;}
    .pmain>:first-child,.pmain>:last-child{margin:0;}
    .phead{grid-column:2;grid-row:1;} .pside{grid-column:2;grid-row:2;justify-self:center;}
    .dial{grid-column:1;grid-row:1/3;width:44vh;height:44vh;margin:0;}
    .dial .num{font-size:15vh;}
    .phase{font-size:18px;} .instr{font-size:13px;margin:0;} .path{height:10vh;}
    .pbottom{display:flex;gap:8px;align-items:center;padding-top:3px;padding-bottom:calc(6px + env(safe-area-inset-bottom));}
    .pbottom .btnrow{flex:1;order:-1;} .pbottom .btnrow button{min-height:50px;}
    .voltoggle{margin:0;} .volpanel{position:absolute;left:18px;right:18px;bottom:66px;}
  }
  @media (prefers-reduced-motion:reduce){.bub{animation:none;opacity:.8;}}
</style>
</head>

<script id="straw-engine">
/* ═══════════════════════════════════════════════════════════════
   音源エンジン（Web Audio）
   【設計理由】
   - 時計は AudioContext.currentTime の1本だけ。音は数秒先まで予約し、画面も同じ時計を読む。
     setInterval で秒を数える方式は、負荷がかかると遅れが積み上がるため使わない。
   - 停止・一時停止は「その回の出力（session）」を丸ごと切り離す。予約済みの音も一緒に消える
     ので、再開しても二重に鳴らない。
   - 音はすべて合成（外部音源なし＝著作権・読み込み待ちの問題がない）。
   - iPhoneの消音モード：無音の<audio>ループでページを「メディア再生」扱いにする（317a332 の対策を継承）。
   Babelを通さない素のJS。DOMに依存しない計算は Core にまとめ、単体でテストできる。
   ═══════════════════════════════════════════════════════════════ */
(function(global){
"use strict";

var COUNT_IN = 4;        // 毎回の発声前の準備拍
var ACCENT_EVERY = 4;
var LOOKAHEAD_SEC = 5;   // 先読み量。画面の処理がこの秒数止まっても音は乱れない
var TICK_MS = 100;
var START_DELAY = 0.12;
var LATE_GRACE = 0.04;   // これ以上遅れた打音は捨てる（まとめ鳴り防止）
var END_TAIL = 1.6;      // 終了ベルの余韻
var OUTPUT = 1.4;          // 全音量最大・全音重なりの実測ピークが0.9未満になる上限
var STALL_MS = 1200;
var RESUME_TIMEOUT_MS = 2500;

/* ---------- Core：計算だけ ---------- */
function midiToHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function hzToMidi(hz){ return Math.round(69 + 12 * Math.log(hz / 440) / Math.LN2); }
var NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
var KANA = ["ド","ド♯","レ","レ♯","ミ","ファ","ファ♯","ソ","ソ♯","ラ","ラ♯","シ"];
function noteName(m){
  var r = Math.round(m), i = ((r % 12) + 12) % 12;
  return {abc: NAMES[i] + (Math.floor(r / 12) - 1), kana: KANA[i]}; // C4＝中央のド
}

/* 音階9音を拍（足りなければ8分音符）の格子に割り付ける。余りは頂点→両端の順に長くする */
var SCALE = [0,2,4,5,7,5,4,2,0];
var EXTRA_ORDER = [4,0,8,2,6,1,7,3,5];
function scaleSlots(beats){
  var sub = 1;
  while(beats * sub < SCALE.length) sub *= 2;
  var units = beats * sub, base = Math.floor(units / SCALE.length), rem = units % SCALE.length;
  var len = SCALE.map(function(){ return base; });
  for(var i = 0; i < rem; i++) len[EXTRA_ORDER[i]]++;
  var at = 0;
  return len.map(function(n, j){ var o = {beat: at / sub, semi: SCALE[j]}; at += n; return o; });
}

/* 発声1本分の音の動き。points は [発声開始からの秒, MIDI番号]。
   MIDI番号で直線補間する＝耳に均等なグライドになる */
function contour(mode, midi, beats, beat){
  var end = beats * beat;
  if(mode === "scale"){
    return {step: true, end: end, points: scaleSlots(beats).map(function(s){ return [s.beat * beat, midi + s.semi]; })};
  }
  if(mode === "glideUpDown") return {step: false, end: end, points: [[0, midi], [end / 2, midi + 12], [end, midi]]};
  if(mode === "glide2oct"){
    var top = Math.round(beats * 0.6 * 2) / 2 * beat; // 頂点は拍か裏拍に乗せる
    return {step: false, end: end, points: [[0, midi], [top, midi + 24], [end, midi]]};
  }
  return {step: false, end: end, points: [[0, midi], [end, midi]]};
}
function midiAt(c, t){
  var p = c.points;
  if(t <= p[0][0]) return p[0][1];
  for(var i = p.length - 1; i >= 0; i--){
    if(t + 1e-7 < p[i][0]) continue;
    if(c.step || i === p.length - 1) return p[i][1];
    return p[i][1] + (p[i+1][1] - p[i][1]) * (t - p[i][0]) / (p[i+1][0] - p[i][0]);
  }
  return p[0][1];
}

/* 秒数の負荷を保ったまま拍に丸める。休憩には必ず4拍の準備が入る */
function timing(ex, bpm){
  var beat = 60 / bpm;
  var work = Math.max(1, Math.round(ex.workSec / beat));
  var gap = Math.max(COUNT_IN, Math.round(ex.restSec / beat));
  return {beat: beat, work: work, rest: gap - COUNT_IN, workSec: work * beat};
}

/* o = {bpm, transpose, guide:"sustain"|"before"|"every4", reps, from} */
function buildPlan(ex, o){
  var tm = timing(ex, o.bpm), beat = tm.beat, from = o.from || 1;
  var phases = [], events = [], at = 0; // at は拍。掛け算で秒にするので誤差が積もらない
  function add(e){ events.push(e); }
  function phase(kind, rep, beats, midi, c){
    var p = {kind: kind, rep: rep, startBeat: at, beats: beats, start: at * beat, end: (at + beats) * beat, midi: midi, contour: c || null};
    phases.push(p);
    for(var i = 0; i < beats; i++){

    if(rep > from && tm.rest > 0) phase("rest", rep - 1, tm.rest, midi);

    var prep = phase("prep", rep, COUNT_IN, midi);

    add({type: "note", at: prep.start, midi: midi, dur: 2 * beat, level: 1});
    add({type: "note", at: prep.start + 2 * beat, midi: midi, dur: 2 * beat, level: 0.8});

function locate(plan, t){

/* ---------- 音色 ---------- */
function render(ctx, sec, fn){

/* ウッドブロック：少し下がる基音＋すぐ消える非整数倍音 */
function wood(ctx, hz){
  var TAU = Math.PI * 2;
  return render(ctx, 0.14, function(t){
    var atk = Math.min(1, t / 0.0015);
    var body = Math.sin(TAU * (hz * t + hz * 0.0012 * (1 - Math.exp(-t / 0.008)))) * Math.exp(-t / 0.022);
    var knock = Math.sin(TAU * hz * 1.58 * t) * Math.exp(-t / 0.007) * 0.3;
    return atk * (body + knock) * 0.8;

}
function createKit(ctx){
  var h = [0, 1, 0.5, 0.26, 0.12, 0.06, 0.025];
  return {
    click: wood(ctx, 900), accent: wood(ctx, 1200),
    wave: ctx.createPeriodicWave(new Float32Array(h.length), new Float32Array(h))

}

function oscillator(ctx, hz, at, until, gain, type){
  var o = ctx.createOscillator();
  if(type) o.type = type;
  o.frequency.value = hz;
  o.connect(gain);
  o.onended = function(){ o.disconnect(); gain.disconnect(); };

  return o;
}

/* ピアノ系の打音：倍音ほど小さく、速く消える。音程がぶれないよう倍音は整数比 */
var PIANO = [[1,0.62,1],[2,0.30,0.7],[3,0.13,0.5],[4,0.07,0.35],[5,0.03,0.25]];
function playNote(ctx, out, e, at){
  var hz = midiToHz(e.midi), dur = Math.max(0.15, e.dur);

    g.gain.setTargetAtTime(0, at + 0.008, tau);
    // 次の音にかぶらないよう最後は確実に0へ。setTargetの到達値から直線で落とす
    var rel = end - 0.06;
    g.gain.setValueAtTime(peak * Math.exp(-(rel - at - 0.008) / tau), rel);
    g.gain.linearRampToValueAtTime(0, end);
    g.connect(out);
    oscillator(ctx, hz * p[0], at, end + 0.01, g);

}

function playSustain(ctx, kit, out, e, at, until, offset){
  var c = e.contour, g = ctx.createGain(), peak = 0.15 * e.level;

    g.gain.linearRampToValueAtTime(peak * 0.3, until - rel);
  } else {
    g.gain.linearRampToValueAtTime(peak, at + atk);
    g.gain.setValueAtTime(peak, until - rel);
  }
  g.gain.linearRampToValueAtTime(0, until); // フェードは終了時刻ちょうどに終わる
  g.connect(out);

  var o = ctx.createOscillator(), origin = at - offset;
  o.setPeriodicWave(kit.wave);
  o.frequency.setValueAtTime(midiToHz(midiAt(c, offset)), at);
  c.points.forEach(function(p){
    var t = origin + p[0];
    if(t <= at) return;
    if(c.step) o.frequency.setTargetAtTime(midiToHz(p[1]), t, 0.008); // 8msでつなぎ、プチ音を防ぐ
    else o.frequency.exponentialRampToValueAtTime(midiToHz(p[1]), t);

/* ベル：目標音と同じ音名にして音程の邪魔をしない。開始＝高い1音、終了＝5度→主音へ下がる2音 */
function playBell(ctx, out, e, at){
  var m = e.midi;
  while(m < 81) m += 12;
  while(m >= 93) m -= 12;
  var hits = e.end ? [[m - 5, 0, 0.5, 0.12], [m - 12, 0.16, 1.1, 0.14]] : [[m, 0, 0.7, 0.15]];

      oscillator(ctx, midiToHz(h[0]) * p[0], t, t + d + 0.01, g);

function scheduleEvent(ctx, kit, buses, e, origin){
  var now = ctx.currentTime, at = origin + e.at;
  if(e.type === "sustain"){ // 持続音だけは遅れても途中から合流する

function curve(v){ return Math.pow(v / 100, 1.5); }
function createMixer(ctx, vol){
  var master = ctx.createGain(), click = ctx.createGain(), guide = ctx.createGain(), bell = ctx.createGain();

  master.gain.value = OUTPUT * curve(vol.master); click.gain.value = curve(vol.click); guide.gain.value = curve(vol.guide);
  return {click: click, guide: guide, bell: bell, set: function(v){
    var t = ctx.currentTime;
    master.gain.setTargetAtTime(OUTPUT * curve(v.master), t, 0.015);
    click.gain.setTargetAtTime(curve(v.click), t, 0.015);
    guide.gain.setTargetAtTime(curve(v.guide), t, 0.015);

}
function createSession(ctx, mixer){
  var s = {click: ctx.createGain(), guide: ctx.createGain(), bell: ctx.createGain()};
  ["click","guide","bell"].forEach(function(k){ s[k].connect(mixer[k]); });
  s.cut = function(){
    var t = ctx.currentTime;
    ["click","guide","bell"].forEach(function(k){
      s[k].gain.setValueAtTime(1, t);
      s[k].gain.linearRampToValueAtTime(0, t + 0.025);
    });
    setTimeout(function(){ ["click","guide","bell"].forEach(function(k){ s[k].disconnect(); }); }, 60);
  };

}

/* ---------- iPhone消音モード対策 ---------- */
function silentWav(){
  var sr = 44100, size = sr * 2, v = new DataView(new ArrayBuffer(44 + size));

  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);

function MediaChannel(){

      el.setAttribute("playsinline", "");

/* ---------- 再生制御 ---------- */
function Engine(){

  var ctx = null, kit = null, mixer = null, session = null, stale = false;

      emit({status: "idle", failed: true});
    });
  };
}

/* ---------- 音源エンジンとの接続・練習設定（端末内に保存） ---------- */
const Core = StrawAudio.Core;
const SET_KEY = "straw_trainer_settings_v1";
const DEFAULTS = {bpm:60, transpose:0, guide:"sustain", silent:false, master:90, click:70, pitch:80, reps:{}, lastId:null};
const GUIDES = [
  {id:"sustain", name:"発声中も持続", note:"目標音が小さく鳴り続けます（標準）"},
  {id:"before",  name:"開始前のみ",   note:"準備中に目標音を聞き、発声中はクリックだけで練習します"},
  {id:"every4",  name:"4拍ごと",      note:"発声中、4拍ごとに目標音を鳴らし直します"},
];
function intIn(v, min, max, fallback){
  return typeof v === "number" && isFinite(v) ? Math.max(min, Math.min(max, Math.round(v))) : fallback;
}
// 保存値が壊れていても起動できるよう、項目ごとに検証して読む
function loadSettings(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(SET_KEY)); }catch(e){}
  const v = raw && typeof raw === "object" ? raw : {};
  const reps = {};
  EXERCISES.forEach(ex=>{
    if(ex.mode==="phrase" || !v.reps) return;
    const n = intIn(v.reps[ex.id], 1, 10, null);
    if(n) reps[ex.id] = n;
  });
  return {
    bpm: intIn(v.bpm, 40, 120, DEFAULTS.bpm),
    transpose: intIn(v.transpose, -12, 12, DEFAULTS.transpose),
    guide: GUIDES.some(g=>g.id===v.guide) ? v.guide : DEFAULTS.guide,
    silent: v.silent === true,
    master: intIn(v.master, 0, 100, DEFAULTS.master),
    click: intIn(v.click, 0, 100, DEFAULTS.click),
    pitch: intIn(v.pitch, 0, 100, DEFAULTS.pitch),
    reps,
    lastId: EXERCISES.some(e=>e.id===v.lastId) ? v.lastId : null,
  };
}
function volumesOf(s){ return {master:s.master, click:s.click, guide:s.pitch}; }
function baseMidi(ex, s){ return Core.hzToMidi(ex.toneHz) + s.transpose; }
function repsOf(ex, s){ return s.reps[ex.id] || ex.reps; }
function noteText(m){ const n = Core.noteName(m); return n.kana + " " + n.abc; }
function semitoneText(n){ return n===0 ? "標準" : (n>0 ? "+" : "−") + Math.abs(n) + "半音"; }
function rangeText(ex, s){
  const m = baseMidi(ex, s);
  if(ex.semitone) return noteText(m) + "から半音ずつ";
  if(ex.toneMode==="glideUpDown") return noteText(m) + " 〜 " + noteText(m+12);
  if(ex.toneMode==="glide2oct") return noteText(m) + " 〜 " + noteText(m+24);
  return noteText(m);
}
function secText(sec){ return String(Math.round(sec*10)/10); }
function clockText(sec){ const n = Math.max(0, Math.ceil(sec - 0.02)); return Math.floor(n/60) + ":" + String(n%60).padStart(2,"0"); }

function useEngine(){
  const [engine] = useState(()=> new StrawAudio.Engine());
  const [state, setState] = useState(engine.state);
  useEffect(()=>{
    const off = engine.subscribe(setState);
    // 画面を離れたら一時停止（気づかないまま鳴り続けない／iOSの中断からも安全に復帰）
    const vis = ()=>{ if(document.hidden) engine.hidden(); };
    const leave = ()=> engine.hidden();
    document.addEventListener("visibilitychange", vis);
    window.addEventListener("pagehide", leave);
    return ()=>{
      off(); engine.stop();
      document.removeEventListener("visibilitychange", vis);
      window.removeEventListener("pagehide", leave);
    };
  },[engine]);
  return [engine, state];
}

/* ---------- アクセス・フィードバック収集（GAS → Googleスプレッドシート） ---------- */
// 既存2作（音楽クイズ・ハモリ）と同方式。GASのWebアプリURLを下に貼ると送信が有効になる。
// 空欄のあいだは一切送信しない（＝プライバシー面で安全なデフォルト）。
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwZbWQgbUTr8Bop9pB1VTCSwUVkUS1JWerCrM7L1TW3dJklIlL03LiYUOMLU6EV5kxr/exec";
const LOG_HOSTS = ["shion-voice.com", "www.shion-voice.com"];
function logEvent(type, payload){
  // 本番ドメイン以外（手元の確認用サーバー等）からは送らない＝利用ログを汚さない
  if(!GOOGLE_SHEET_URL || !LOG_HOSTS.includes(location.hostname)) return;

      headers:{"Content-Type":"text/plain;charset=utf-8"}, // CORSプリフライト回避のためtext/plain
      body: JSON.stringify(Object.assign({type:type, ts:new Date().toISOString()}, payload||{}))

  }catch(e){ /* 送信失敗はアプリ動作に影響させない */ }
}

/* ---------- 練習記録（localStorage・軽量ストリーク） ---------- */
const LS_KEY = "straw_trainer_log_v1";
function todayStr(){ return new Date().toLocaleDateString("sv-SE"); } // YYYY-MM-DD(ローカル)
function loadLog(){
  try{
    const v = JSON.parse(localStorage.getItem(LS_KEY));
    if(v && typeof v.last === "string") return {last:v.last, streak:Number(v.streak) || 0};
  }catch(e){}
  return {last:"", streak:0};
}
function yesterdayStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toLocaleDateString("sv-SE"); }
// 昨日も今日も練習していなければ、連続は途切れている
function currentStreak(log){ return (log.last===todayStr() || log.last===yesterdayStr()) ? log.streak : 0; }
function markDone(){
  const log = loadLog();
  const today = todayStr();
  if(log.last === today) return log; // 今日は記録済み
  const yesterday = yesterdayStr();
  const next = {last:today, streak: log.last===yesterday ? (log.streak||0)+1 : 1};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(next)); }catch(e){}
  return next;
}

  );

// 音程（強弱種目では音量）の動きを線で見せる＝音なしでも練習できる
function GuidePath({ex, contour, t}){
  const swell = ex.toneMode==="swell";
  const pts = swell ? [[0,0],[contour.end/2,1],[contour.end,0]] : contour.points;
  const values = pts.map(p=>p[1]);
  const lo = Math.min.apply(null, values), span = Math.max.apply(null, values) - lo;
  const x = sec => 10 + 280*sec/contour.end;
  const y = v => span ? 52 - 42*(v-lo)/span : 31;
  let d = "M" + x(0) + " " + y(values[0]);
  pts.slice(1).forEach(p=>{
    d += (!swell && contour.step) ? " H" + x(p[0]) + " V" + y(p[1]) : " L" + x(p[0]) + " " + y(p[1]);
  });
  if(!swell && contour.step) d += " H" + x(contour.end);
  const now = swell ? Math.max(0, 1 - Math.abs(2*t/contour.end - 1)) : Core.midiAt(contour, t);
  return (
    <>
      <svg className="path" viewBox="0 0 300 62" aria-hidden="true">
        <path d={d} fill="none" stroke="var(--pc)" strokeOpacity=".4" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>
        <circle cx={x(t)} cy={y(now)} r="8" fill="var(--pc)"/>
      </svg>
      <div className="pathlabel">{swell ? "声の大きさ：小 → 大 → 小" : "音の高さの動き"}</div>
    </>
  );
}

const PHASES = {
  prep: {name:"準備", text:"目標の音を聞いて、息を吸う"},
  work: {name:"発声", text:"ストローで「ウー」"},
  rest: {name:"休憩", text:"力を抜いて、ひと休み"},
};

function Player({engine, state, settings, update}){
  const [,setFrame] = useState(0);
  const [showVol, setShowVol] = useState(false);
  const boxRef = useRef(null);
  const {status, job, plan} = state;

  useEffect(()=>{
    if(status!=="running") return;
    let id;
    const loop = ()=>{ setFrame(f=>f+1); id = requestAnimationFrame(loop); };
    id = requestAnimationFrame(loop);
    return ()=> cancelAnimationFrame(id);
  },[status]);

  // 背面を操作・読み上げ対象から外す
  useEffect(()=>{
    const root = document.getElementById("root");
    const back = document.activeElement;
    root.inert = true;
    document.body.style.overflow = "hidden";
    boxRef.current.focus();
    return ()=>{
      root.inert = false;
      document.body.style.overflow = "";
      if(back && back.isConnected) back.focus({preventScroll:true});
    };
  },[]);

  const ex = job.ex;
  const ended = status==="done", halted = status==="paused" || status==="error";
  let look = "done", body;

  if(ended){
    body = (
      <>
        <div className="phead"><span className="phase" role="status">完了</span></div>
        <div style={{fontSize:"32px",fontWeight:900,margin:"22px 0 6px",color:"var(--green)"}}>お疲れさま！</div>
        <div style={{fontSize:"14px"}}>今日の練習を記録しました 🎉</div>
      </>
    );
  } else {
    const t = status==="running" ? Math.min(plan.total, Math.max(0, engine.position())) : status==="paused" ? state.at : 0;
    const loc = Core.locate(plan, t), ph = loc.phase;
    const next = plan.phases.find(p=>p.kind==="work" && p.end > t) || plan.phases[plan.phases.length-1];
    const inWork = ph.kind==="work";
    const workT = inWork ? loc.into : 0;
    const note = Math.round(Core.midiAt(next.contour, workT));
    const beatsLeft = ph.beats - loc.beat;
    look = halted ? "paused" : ph.kind;

    let title = PHASES[ph.kind].name, text = PHASES[ph.kind].text;
    if(ph.kind==="prep" && job.silent) text = "数に合わせて、息を吸う";
    if(inWork && ex.dynamics){
      const inten = Math.max(0, 1 - Math.abs(2*loc.progress - 1));
      text = inten>0.66 ? "強く！" : inten>0.33 ? (loc.progress<0.5 ? "だんだん強く" : "だんだん弱く") : "弱く";
    }
    if(inWork && ex.water) text += "・泡を一定に";
    if(status==="starting") text = "音を準備しています…";
    if(status==="paused"){
      title = "一時停止";
      text = state.reason==="interrupted" ? "音が中断されました。再開を押してください"
        : "再開すると、準備4拍から" + job.from + "本目を始めます";
    }
    if(status==="error"){ title = "音が出せません"; text = "もう一度試すか、画面だけで練習できます"; }

    const R = 92, len = 2*Math.PI*R;
    body = (
      <>
        <div className="phead">
          <span className="phase" role="status">{title}</span>
          <div className="instr">{text}</div>
        </div>
        <div className="dial">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle className="track" cx="100" cy="100" r={R}/>
            <circle className="bar" cx="100" cy="100" r={R} strokeDasharray={len} strokeDashoffset={len*(1-loc.progress)}/>
          </svg>
          <div className="in">
            <span className="num">{ph.kind==="prep" ? beatsLeft : Math.max(1, Math.ceil(loc.left - 0.02))}</span>
            <span className="unit">{ph.kind==="prep" ? "拍後に発声" : "残り秒"}</span>
          </div>
        </div>
        <div className="pside">
          <div className="beats" aria-hidden="true">
            {[0,1,2,3].map(i=><i key={i} className={status==="running" && loc.beat%4===i ? "on" : ""}/>)}
          </div>
          <div className="readout">
            <div><span>{inWork ? "いまの音" : "次の音"}</span><b className="now-note">{noteText(note)}</b></div>
            <div><span>拍</span><b className="now-beat">{loc.beat+1} / {ph.beats}</b></div>
            <div><span>全体の残り</span><b>{clockText(plan.total - t)}</b></div>
          </div>
          <GuidePath ex={ex} contour={next.contour} t={workT}/>
        </div>
      </>
    );
  }

  const current = ended ? job.reps : (status==="running"
    ? Core.locate(plan, engine.position()).phase.rep : job.from);

  return ReactDOM.createPortal(
    <div className={"player "+look} role="dialog" aria-modal="true" aria-label={ex.title+"の練習"} tabIndex="-1" ref={boxRef}
      onKeyDown={e=>{ if(e.key==="Escape"){ if(status==="running") engine.pause(); else engine.stop(); } }}>
      <div className="safety">⚠️ 痛み・違和感が出たら、すぐに中止してください</div>
      <div className="ptop">
        <div className="t">{ex.id}. {ex.title}</div>
        <div className="r">{current} / {job.reps} 本目　BPM {job.bpm}{job.silent ? "　画面だけ" : ""}</div>
      </div>
      <div className="pmain">{body}</div>
      <div className="pbottom">
        {!ended && !job.silent && showVol && <div className="volpanel"><VolumeSliders settings={settings} update={update}/></div>}
        {!ended && !job.silent && status!=="error" &&
          <button className="voltoggle" aria-expanded={showVol} onClick={()=>setShowVol(v=>!v)}>{showVol ? "音量を閉じる" : "音量"}</button>}
        {status==="error" && <button className="voltoggle" onClick={()=>engine.resume(true)}>音なし（画面だけ）で練習する</button>}
        <div className="btnrow">
          {(status==="running" || status==="starting") && <button key="pause" className="btn-pause" onClick={()=>engine.pause()}>Ⅱ 一時停止</button>}
          {halted && <button key="resume" className="btn-go" onClick={()=>engine.resume()}>{status==="error" ? "もう一度試す" : "▶ 再開"}</button>}
          {ended && <button key="again" className="btn-go" onClick={()=>engine.start(Object.assign({}, job, {from:1}))}>▶ もう一度</button>}
          <button key="stop" className="btn-stop" onClick={()=>engine.stop()}>{ended ? "閉じる" : "■ 停止"}</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

/* ---------- 種目を開いたとき ---------- */
function Runner({ex, engine, state, settings, update, start}){
  const reps = repsOf(ex, settings);
  const demoing = state.status==="demo" && state.id===ex.id;
  return (
    <div>
      <Stepper name="音程" value={settings.transpose} min={-12} max={12} format={semitoneText} onChange={v=>update({transpose:v})}/>
      <div style={{fontSize:"12px",color:"var(--muted)"}}>この種目の高さ：{rangeText(ex, settings)}</div>
      <Stepper name="本数" value={reps} min={1} max={10} format={v=>v+"本"}
        onChange={v=>update({reps:Object.assign({}, settings.reps, {[ex.id]:v})})}/>
      <button className="btn-primary btn-big" style={{marginTop:"6px"}} onClick={()=>start(ex)}>▶ スタート（{reps}本）</button>
      {ex.toneMode!=="none" &&
        <button className="btn-tone" style={{width:"100%",marginTop:"8px"}}
          onClick={()=> demoing ? engine.stop() : engine.demo({id:ex.id, bpm:settings.bpm, midi:baseMidi(ex, settings),
            sec:Math.min(ex.workSec, 6), mode:ex.toneMode, volumes:volumesOf(settings)})}>
          {demoing ? "■ 止める" : "♪ お手本"}
        </button>}
    </div>
  );
}

/* ---------- 課題曲（カウントなし・サビ3回のチェック式） ---------- */
function PhraseRunner({ex, onDone}){
  const [done, setDone] = useState([false,false,false]);
  const firedRef = useRef(false);
  function toggle(i){
    const nd = done.slice(); nd[i] = !nd[i];
    setDone(nd);
    if(nd.every(Boolean) && !firedRef.current){
      firedRef.current = true;
      onDone(ex);
    }
  }
  const allDone = done.every(Boolean);
  return (
    <div>
      {ex.rounds.map((r,i)=>(
        <button key={i} onClick={()=>toggle(i)} className="round" aria-pressed={done[i]}
          style={{background: done[i] ? "#eaf6ee" : "var(--surface)",
                  borderColor: done[i] ? "var(--green)" : "var(--line)"}}>
          <span style={{color: done[i] ? "var(--green)" : "var(--muted)", fontWeight:900, fontSize:"16px"}}>{done[i] ? "✓" : "○"}</span>
          <span>
            <b style={{color: done[i] ? "var(--green)" : "var(--ink)"}}>{r.n}：{r.t}</b>
            <span style={{display:"block",fontSize:"12px",color:"var(--muted)",fontWeight:400,marginTop:"2px"}}>{r.d}</span>
          </span>
        </button>
      ))}
      {allDone && <div style={{textAlign:"center",color:"var(--green)",fontWeight:800,marginTop:"4px"}}>お疲れさま！記録しました 🎉</div>}
    </div>
  );
}

/* ---------- ストロー太さ比較図（実物比率のSVG断面） ---------- */
function StrawScaleFigure(){
  const scale = 2.0;   // 1mm = 2 単位
  const base = 88;     // 円の底辺を揃える
  const xs = [58, 150, 244];
  return (
    <svg viewBox="0 0 300 134" width="100%" style={{maxWidth:"340px",display:"block",margin:"2px auto 0"}}
         role="img" aria-label="ストローの太さ比較（太いほど抵抗が弱い）">
      <text x="150" y="12" textAnchor="middle" fontSize="9" fill="#7a6d64">穴が大きいほど抵抗は弱い＝ラク</text>
      {STRAWS.map((s,i)=>{
        const r = s.mm*scale, cx = xs[i], cy = base - r;
        return (
          <g key={s.key}>
            <circle cx={cx} cy={cy} r={r} fill={s.color} fillOpacity="0.16" stroke={s.color} strokeWidth="1.5"/>
            <circle cx={cx} cy={cy} r={r*0.44} fill="#f8f3ee" stroke={s.color} strokeWidth="1"/>
            <text x={cx} y="106" textAnchor="middle" fontSize="9.5" fontWeight="700" fill="#1a1714">{s.name.replace(/（.*$/,"")}</text>
            <text x={cx} y="118" textAnchor="middle" fontSize="8.5" fill="#7a6d64">{s.dia}</text>
            <text x={cx} y="130" textAnchor="middle" fontSize="8.5" fontWeight="700" fill={s.color}>{s.bp}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- ストローの選び方（図＋入手先ガイド） ---------- */
function StrawGuide(){
  return (
    <div className="card">
      <StrawScaleFigure/>
      <div style={{marginTop:"12px"}}>
        {STRAWS.map(s=>(
          <div className="step" key={s.key}>
            <div style={{flex:"0 0 66px"}}>
              <span style={{display:"inline-block",background:s.color,color:"#fff",fontSize:"11px",
                fontWeight:700,padding:"3px 8px",borderRadius:"6px"}}>{s.dia}</span>
            </div>
            <div className="b"><b>{s.name}</b><span>{s.where}</span></div>
          </div>
        ))}
      </div>
      <p style={{fontSize:"11.5px",color:"var(--muted)",marginTop:"9px"}}>
        科学的な最適は内径2〜5mm。4mmはその範囲で最も入手しやすいサイズです。
        背圧の実測目安：3mm≈16／6mm≈4 cmH₂O（細いほど強い）。出典：Rayvox、Titze ほか。
      </p>
    </div>
  );
}

      {last && (
        <div className="card quick">
          <div className="k">前回の練習</div>
          <div className="t">{last.id}. {last.title}</div>
          <div className="m">{last.mode==="phrase" ? "サビ3回（カウントなし）"
            : rangeText(last, settings) + "・BPM " + settings.bpm + "・" + repsOf(last, settings) + "本"}</div>
          {last.mode==="phrase"
            ? <button className="btn-primary btn-big" onClick={()=>toggle(last.id)}>前回の練習を開く</button>
            : <button className="btn-primary btn-big" onClick={()=>start(last)}>▶ 前回の練習を始める</button>}
        </div>
      )}
      {state.failed && <div className="notice" role="alert">音を再生できませんでした。もう一度タップするか、ページを再読み込みしてください。</div>}
      <SettingsPanel engine={engine} state={state} settings={settings} update={update}/>
      {groups.map(([key,label])=>(
        <div key={key}>
          <div className="lead" style={{color:LV[key].color}}>{label}</div>
          {EXERCISES.filter(e=>e.lv===key).map(ex=>{
            const open = openId===ex.id;
            const phrase = ex.mode==="phrase";
            return (
              <div className="card ex" key={ex.id} ref={el=>{ cards.current[ex.id] = el; }}>
                <div className="exhead">
                  <span className="lv" style={{background:LV[ex.lv].color}}>{LV[ex.lv].name}</span>
                  <b style={{fontSize:"15px"}}>{ex.id}. {ex.title}</b>
                </div>
                <div className="goal">{ex.goal}</div>
                <div className="spec">
                  <span className="badge">🥤 {ex.straw}</span>
                  <span className="badge">{phrase ? "🎵 サビ3回（カウントなし）"
                    : "⏱ "+secText(Core.timing(ex, settings.bpm).workSec)+"秒 × "+repsOf(ex, settings)+"本"}</span>
                </div>
                {open ? (
                  <>
                    <div className="cue"><b>成功のサイン：</b>{ex.cue}</div>
                    {phrase
                      ? <PhraseRunner ex={ex} onDone={onDone} />
                      : <Runner ex={ex} engine={engine} state={state} settings={settings} update={update} start={start} />}
                    {ex.water && <div style={{marginTop:"10px"}}><WaterStrawAnim/></div>}
                    <div style={{textAlign:"center",marginTop:"10px"}}>
                      <button className="btn-ghost" onClick={()=>toggle(null)} style={{fontSize:"12.5px",padding:"7px 14px"}}>閉じる</button>
                    </div>
                  </>
                ) : (
                  <div className="btnrow">
                    <button className="btn-primary" onClick={()=>toggle(ex.id)}>開いて練習する</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function FeedbackScreen(){
  const [rating, setRating] = useState(0);
  const [text, setText] = useState("");
  const [name, setName] = useState("");
  const [sent, setSent] = useState(false);
  function submit(){
    logEvent("feedback", {rating:rating, text:text.slice(0,1000), name:name.slice(0,50)});
    setSent(true);
  }
  if(sent){
    return (
      <div className="screen">
        <div className="card" style={{textAlign:"center",padding:"28px 16px"}}>
          <div style={{fontSize:"34px"}}>🙏</div>
          <p style={{marginTop:"8px",fontWeight:700}}>ありがとうございました！</p>
          <p style={{fontSize:"12.5px",color:"var(--muted)",marginTop:"4px"}}>いただいた声はアプリの改善に活かします。</p>
        </div>
      </div>
    );
  }
  return (
    <div className="screen">
      <div className="lead">📝 フィードバック</div>
      <div className="sectionNote">使ってみた感想を教えてください（任意・匿名でOK）。</div>
      <div className="card">
        <p style={{fontSize:"13px",fontWeight:700,marginBottom:"8px"}}>使いやすさ・満足度</p>
        <div style={{display:"flex",gap:"6px",marginBottom:"16px"}}>
          {[1,2,3,4,5].map(n=>(
            <button key={n} onClick={()=>setRating(n)} aria-label={n+"点"}
              style={{flex:1,padding:"9px 0",background:n<=rating?"var(--amber-l)":"var(--surface)",
                color:n<=rating?"#fff":"var(--muted)",border:"1px solid var(--line)",fontSize:"17px"}}>★</button>
          ))}
        </div>
        <p style={{fontSize:"13px",fontWeight:700,marginBottom:"6px"}}>感想・要望（任意）</p>
        <textarea value={text} onChange={e=>setText(e.target.value)} rows="4"
          placeholder="例：背圧の意味がわかった／基準音がもう少し低いと助かる など"
          style={{width:"100%",border:"1px solid var(--line)",borderRadius:"10px",padding:"10px",
            fontFamily:"inherit",fontSize:"16px",resize:"vertical",color:"var(--ink)"}}/>
        <p style={{fontSize:"13px",fontWeight:700,margin:"12px 0 6px"}}>お名前（任意）</p>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="ニックネームでもOK"
          style={{width:"100%",border:"1px solid var(--line)",borderRadius:"10px",padding:"10px",
            fontFamily:"inherit",fontSize:"16px",color:"var(--ink)"}}/>
        <button className="btn-primary" style={{width:"100%",marginTop:"16px",opacity:(!rating && !text.trim())?0.5:1}}
          onClick={submit} disabled={!rating && !text.trim()}>送信する</button>
        <p style={{fontSize:"11px",color:"var(--muted)",marginTop:"10px"}}>
          いただいた内容はサービス改善のみに使用します。個人を特定する情報の入力は不要です。
        </p>
      </div>
    </div>
  );
}

/* ---------- ルート ---------- */
function App(){
  const [log, setLog] = useState(loadLog);
  const [settings, setSettings] = useState(loadSettings);
  // 初回は解説・注意点から。練習したことがある人はメニューから
  const [tab, setTab] = useState(()=> (log.last || settings.lastId) ? "menu" : "why");
  const [engine, state] = useEngine();

  function update(patch){
    setSettings(prev=>Object.assign({}, prev, patch));
    const volumeOnly = Object.keys(patch).every(k=> k==="master" || k==="click" || k==="pitch");
    if(!volumeOnly && engine.state.status==="demo") engine.stop();
  }
  useEffect(()=>{
    try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }catch(e){}
    engine.setVolumes(volumesOf(settings));
  },[settings]);

  function onDone(ex){
    setLog(markDone());
    logEvent("complete", {id:ex.id, title:ex.title});
    if(ex.mode==="phrase") update({lastId:ex.id});
  }
  // タップ処理の中から同期的に呼ぶこと（iPhoneの音声解禁条件）
  function start(ex){
    engine.start({ex, reps:repsOf(ex, settings), bpm:settings.bpm, transpose:settings.transpose, guide:settings.guide,
      silent:settings.silent, volumes:volumesOf(settings), onComplete:()=>onDone(ex)});
    update({lastId:ex.id});
  }

  useEffect(()=>{ logEvent("access"); }, []);  // 起動時にアクセス記録（URL未設定なら無送信）

  const tabs = [
    {id:"why",  ic:"💡", label:"なぜ"},
    {id:"how",  ic:"📋", label:"やり方"},
    {id:"menu", ic:"🎯", label:"メニュー"},
    {id:"feedback", ic:"📝", label:"感想"},
  ];
  const isToday = log.last === todayStr();
  const playing = ["starting","running","paused","done","error"].includes(state.status);

  return (
    <div className="app">
      <div className="safety">⚠️ 痛み・違和感が出たら、すぐに中止してください</div>
      <div className="head">
        <h1>ストロー発声トレーナー <span style={{fontSize:"12px",color:"var(--muted)",fontWeight:400}}>β</span></h1>
        <p>SOVT（半閉鎖声道）で、力まない発声を毎日のセルフケアに。</p>
        <div className="streak">
          🔥 <span>連続</span><b>{currentStreak(log)}</b><span>日</span>
          <span style={{color:"var(--muted)"}}>{isToday ? "／今日は達成 ✓" : "／今日はまだ"}</span>
        </div>
      </div>

      {tab==="why"      && <WhyScreen/>}
      {tab==="how"      && <HowtoScreen engine={engine} state={state} settings={settings}/>}
      {tab==="menu"     && <MenuScreen engine={engine} state={state} settings={settings} update={update} start={start} onDone={onDone}/>}
      {tab==="feedback" && <FeedbackScreen/>}

      <div className="foot">
        本アプリは声のセルフケアを補助する教育目的のツールです。診断・治療を目的とするものではありません。<br/>
        痛み・声がれ・違和感が続く場合は、耳鼻咽喉科など専門家にご相談ください。<br/>
        © SHIONボイストレーニング教室
      </div>

      <nav><div className="inner">
        {tabs.map(t=>(
          <button key={t.id} className={tab===t.id?"on":""} aria-current={tab===t.id?"page":undefined}
            onClick={()=>{ engine.stop(); setTab(t.id); window.scrollTo(0,0); }}>
            <span className="ic" aria-hidden="true">{t.ic}</span>{t.label}
          </button>
        ))}
      </div></nav>

      {playing && <Player engine={engine} state={state} settings={settings} update={update}/>}
    </div>
  );
}

const el = document.getElementById("loading");
if(el) el.style.display = "none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
